# Read the Docs configuration file for Sphinx projects
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the OS, Python version and other tools you might need
build:
  os: ubuntu-22.04
  tools:
    python: "miniconda3-3.12-24.9"
    # You can also specify other tool versions:
    # nodejs: "20"
    # rust: "1.70"
    # golang: "1.20"

  # GMT 通过 conda-forge 安装，以使用较新的版本
  apt_packages: [
    "doxygen", 
    "build-essential", 
    "libfftw3-dev", 
    "libnetcdf-dev", 
    "netcdf-bin",
    "nco",
    "pdf2svg",
    "bc",
    "ripgrep"
  ]

  jobs:
    post_checkout:
      # 深拷贝以记录完整 git 历史
      - git fetch --unshallow || true
    
    pre_build:
      # 每项独立回传日志，示例内部记录命令及耗时
      - "cd docs && bash rtd_environment.sh"
      - "cd pygrt/C_extension && make clean"
      - "cd pygrt/C_extension && python ../../docs/rtd_diagnose.py make -j"
      - "cp pygrt/C_extension/bin/* \"$(dirname \"$(command -v python)\")/\""
      - "grt -h"
      - "cd docs/source/Advanced/integ_converg/run && python ../../../../rtd_diagnose.py bash -x run.sh"
      - "cd docs/source/Advanced/integ_converg/run_dcm && python ../../../../rtd_diagnose.py bash -x run.sh"
      - "cd docs/source/Advanced/integ_converg/run_ptam && python ../../../../rtd_diagnose.py bash -x run.sh"
      - "cd docs/source/Advanced/k_integ/drift/run && python ../../../../../rtd_diagnose.py bash -x run.sh"
      - "cd docs/source/Advanced/k_integ/safim/run && python ../../../../../rtd_diagnose.py bash -x run.sh"
      - "cd docs/source/Advanced/kernel/run && python ../../../../rtd_diagnose.py bash -x run.sh"
      - "cd docs/source/Advanced/kernel_old/run && python ../../../../rtd_diagnose.py bash -x run.sh"
      - "cd docs/source/Gallery/ex01 && python ../../../rtd_diagnose.py bash -x run.sh"
      - "cd docs/source/Gallery/ex02 && python ../../../rtd_diagnose.py bash -x run.sh"
